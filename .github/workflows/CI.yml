name: STM32 CI/CD Pipeline

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name:  Build (GNU Make)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install ARM GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make

      - name: Build
        working-directory: stm32_drivers
        run: |
          make -j4

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            stm32_drivers/build/*.elf
            stm32_drivers/build/*.bin
            stm32_drivers/build/*.hex
            stm32_drivers/build/*.map
  test:
    name:  Run Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Run Mock Tests
        run: |
          echo "Running firmware unit tests (mock)"
          sleep 2
          echo " All tests passed"

  promote:
    name:  Promote to Release
    runs-on: ubuntu-latest
    needs: [build, test]
    if: ${{ github.ref == 'refs/heads/development' }}
    steps:
      - name: Merge to Release
        run: |
          echo "Promoting to release branch..."
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git fetch origin
          git checkout release
          git merge development --no-edit
          git push origin release
