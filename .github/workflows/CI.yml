name: STM32 CI/CD Pipeline

on:
  push:
    branches: [ development ]
  workflow_dispatch:

jobs:
  build:
    name:  Build Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make
      - name: Build STM32 Firmware
        run: |
          make -C stm32_drivers/Debug || echo "No Makefile yet"
      - uses: actions/upload-artifact@v4
        with:
          name: stm32_firmware
          path: stm32_drivers/Debug/*.bin

  test:
    name:  Run Logic Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - name: Run Unity Tests
        run: |
          echo "Placeholder: run Unity tests here"

  promote:
    name:  Promote to Release
    runs-on: ubuntu-latest
    needs: [build, test]
    if: ${{ success() && github.ref == 'refs/heads/development' }}
    steps:
      - name: Merge development → release
        uses: devmasx/merge-branch@v1.4.0
        with:
          type: now
          from_branch: development
          target_branch: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
