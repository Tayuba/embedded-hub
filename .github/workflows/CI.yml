name: STM32 Industrial CI/CD Pipeline

on:
  push:
    branches: [development]
  pull_request:
    branches: [release]

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: sudo apt-get install -y cppcheck
      - name: Run static analysis
        run: cppcheck --enable=all --inconclusive --error-exitcode=1 Src drivers

  build:
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v3
      - name: Install toolchain
        run: sudo apt-get install -y gcc-arm-none-eabi make
      - name: Build firmware
        working-directory: stm32_drivers
        run: make -j4
      - name: Generate CRC and signature
        run: |
          crc32 stm32_drivers/build/firmware.bin > stm32_drivers/build/firmware.crc
          openssl dgst -sha256 -sign private.pem -out firmware.sig firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: stm32_drivers/build/*

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - name: Run unit tests
        run: make test

  promote:
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - uses: actions/checkout@v3
      - run: |
          git config --global user.name "github-actions"
          git merge development --no-edit
          git push origin release


