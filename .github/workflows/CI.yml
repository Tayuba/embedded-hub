name: STM32 CI/CD Pipeline (Test Mode)

on:
  push:
    branches: [ development ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build Firmware (Mock)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Install Toolchain (Mock)
        run: |
          echo " Mock install of ARM GCC toolchain"
          sleep 2

      - name: Build STM32 Firmware (Simulated)
        run: |
          echo " No real Makefile found. Simulating build..."
          mkdir -p stm32_drivers/Debug
          echo "Fake firmware content" > stm32_drivers/Debug/fake_firmware.bin
          echo " Build simulation complete"

      - name: Upload Firmware Artifact (Mock)
        uses: actions/upload-artifact@v4
        with:
          name: stm32_firmware
          path: stm32_drivers/Debug/*.bin

  test:
    name: Run Logic Tests (Mock)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Run Mock Tests
        run: |
          echo " Running simulated unit tests..."
          sleep 2
          echo " All tests passed (mock mode)."

  promote:
    name: Promote to Release (Mock)
    runs-on: ubuntu-latest
    needs: [build, test]
    if: ${{ success() && github.ref == 'refs/heads/development' }}

    steps:
      - name: Mock Merge to Release
        run: |
          echo " Simulating merge from development → release"
          echo " Mock promotion complete"
